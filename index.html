
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPEN ROAD 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">
  <h2>OPEN ROAD 3D</h2>
  <div id="speed">0 KM/H</div>
  <div id="distance">Distance: 0 m</div>
  <div id="nitroText">NITRO READY</div>
</div>

<div id="garage">
  <button onclick="selectCar(0)">RED</button>
  <button onclick="selectCar(1)">BLUE</button>
  <button onclick="selectCar(2)">BLACK</button>
</div>

<div id="controls">
  <button id="left">◀</button>
  <button id="right">▶</button>
  <button id="brake">BRAKE</button>
  <button id="gas">GAS</button>
  <button id="nitro">NITRO ⚡</button>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
